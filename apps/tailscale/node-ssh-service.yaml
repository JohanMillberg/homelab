apiVersion: v1
kind: Service
metadata:
  name: node-ssh
  namespace: tailscale
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: node-ssh
  namespace: tailscale
  labels:
    kubernetes.io/service-name: node-ssh
addressType: IPv4
endpoints:
  - addresses:
      - 192.168.1.205
ports:
  - name: ssh
    port: 22
    protocol: TCP
