apiVersion: v1
kind: Secret
metadata:
  name: cycling-training-app-secrets
  namespace: cycling-training-app
type: Opaque
stringData:
  # App encryption key (required — generate a random 32+ char string)
  SECRET_KEY: "change-me-to-a-random-secret-at-least-32-chars"
  # LLM for AI-powered workout recommendations (optional but recommended)
  # Uses opencode.ai provider — add your key here
  LLM_API_KEY: ""
  # Intervals.icu API key (optional — users can set per-user in Settings UI)
  INTERVALS_API_KEY: ""
  INTERVALS_ATHLETE_ID: ""
