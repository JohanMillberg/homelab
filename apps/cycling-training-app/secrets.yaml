apiVersion: v1
kind: Secret
metadata:
  name: cycling-training-app-secrets
  namespace: cycling-training-app
type: Opaque
stringData:
  # App encryption key (required — generate a random 32-char hex string)
  SECRET_KEY: "change-me-to-a-random-secret-at-least-32-chars"
  # LLM for AI-powered workout recommendations (optional but recommended)
  # Uses opencode.ai provider — the same key Hermes uses
  LLM_API_KEY: ""
  # Strava OAuth credentials (only needed if users connect Strava directly)
  # Not required when using Intervals.icu as data source
  STRAVA_CLIENT_ID: ""
  STRAVA_CLIENT_SECRET: ""
  # Intervals.icu API key (optional — users can set per-user in Settings UI)
  INTERVALS_API_KEY: ""
  INTERVALS_ATHLETE_ID: ""
