apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-autonomy-scripts
  namespace: hermes
data:
  autonomy_trigger.py: |
    import base64
    import json
    import os
    import re
    import socket
    import subprocess
    import sys
    import threading
    import time
    import textwrap
    import uuid
    from datetime import datetime, timedelta, timezone
    from pathlib import Path

    import jwt
    import requests


    GITHUB_API = "https://api.github.com"
    SA_DIR = Path("/var/run/secrets/kubernetes.io/serviceaccount")


    def env(name, default=None):
        value = os.environ.get(name, default)
        if value is None:
            raise RuntimeError(f"missing required environment variable: {name}")
        return value


    def now_utc():
        return datetime.now(timezone.utc)


    def kube_time(value):
        return value.isoformat().replace("+00:00", "Z")


    def parse_kube_time(value):
        if not value:
            return None
        return datetime.fromisoformat(value.replace("Z", "+00:00"))


    def request_json(method, url, headers=None, **kwargs):
        response = requests.request(method, url, headers=headers, timeout=30, **kwargs)
        if response.status_code >= 400:
            body = response.text[:800]
            raise RuntimeError(f"{method} {url} failed with {response.status_code}: {body}")
        if response.status_code == 204 or not response.text:
            return None
        return response.json()


    def github_app_jwt():
        app_id = env("HERMES_GITHUB_APP_ID")
        private_key = env("HERMES_GITHUB_PRIVATE_KEY")
        issued_at = int(time.time()) - 60
        payload = {
            "iat": issued_at,
            "exp": issued_at + 540,
            "iss": app_id,
        }
        return jwt.encode(payload, private_key, algorithm="RS256")


    def github_installation_token():
        installation_id = env("HERMES_GITHUB_INSTALLATION_ID")
        headers = {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {github_app_jwt()}",
            "X-GitHub-Api-Version": "2022-11-28",
        }
        payload = request_json(
            "POST",
            f"{GITHUB_API}/app/installations/{installation_id}/access_tokens",
            headers=headers,
        )
        return payload["token"]


    def github_headers(token):
        return {
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {token}",
            "X-GitHub-Api-Version": "2022-11-28",
        }


    def github_get(token, path):
        return request_json("GET", f"{GITHUB_API}{path}", headers=github_headers(token))


    def github_request(token, method, path, ok_404=False, **kwargs):
        response = requests.request(
            method,
            f"{GITHUB_API}{path}",
            headers=github_headers(token),
            timeout=30,
            **kwargs,
        )
        if ok_404 and response.status_code == 404:
            return None
        if response.status_code >= 400:
            body = response.text[:800]
            raise RuntimeError(f"{method} {path} failed with {response.status_code}: {body}")
        if response.status_code == 204 or not response.text:
            return None
        return response.json()


    def github_paginate(token, path):
        page = 1
        items = []
        separator = "&" if "?" in path else "?"
        while True:
            payload = github_get(token, f"{path}{separator}per_page=100&page={page}")
            if isinstance(payload, dict) and "repositories" in payload:
                batch = payload["repositories"]
            else:
                batch = payload
            if not batch:
                return items
            items.extend(batch)
            if len(batch) < 100:
                return items
            page += 1


    WORK_LABELS = {
        "hermes-ready": "0E8A16",
        "hermes-clarifying": "D93F0B",
        "hermes-working": "1D76DB",
        "hermes-review": "8250DF",
        "hermes-blocked": "B60205",
        "hermes-done": "59636E",
    }

    WORK_TICKET_TEMPLATE = textwrap.dedent("""\
        ---
        name: Hermes work ticket
        about: Request autonomous Hermes implementation work
        title: ""
        labels: ""
        assignees: ""
        ---

        ## Intent

        ## Target repository

        ## New repository

        ## Goal

        ## Acceptance criteria

        ## Constraints

        ## Notes
    """)


    def work_queue_slug():
        return f"{env('HERMES_GITHUB_ORG')}/{env('HERMES_GITHUB_WORK_QUEUE_REPO')}"


    def ensure_work_queue(token):
        org = env("HERMES_GITHUB_ORG")
        repo = env("HERMES_GITHUB_WORK_QUEUE_REPO")
        slug = f"{org}/{repo}"
        existing = github_request(token, "GET", f"/repos/{slug}", ok_404=True)
        if existing is None:
            github_request(
                token,
                "POST",
                f"/orgs/{org}/repos",
                json={"name": repo, "private": True, "auto_init": True},
            )

        labels = github_paginate(token, f"/repos/{slug}/labels")
        existing_labels = {label.get("name") for label in labels}
        for label, color in WORK_LABELS.items():
            if label not in existing_labels:
                github_request(
                    token,
                    "POST",
                    f"/repos/{slug}/labels",
                    json={"name": label, "color": color, "description": "Hermes autonomy workflow state"},
                )

        template_path = ".github/ISSUE_TEMPLATE/work-ticket.md"
        current = github_request(
            token,
            "GET",
            f"/repos/{slug}/contents/{template_path}",
            ok_404=True,
        )
        desired = WORK_TICKET_TEMPLATE.strip() + "\n"
        encoded = base64.b64encode(desired.encode()).decode()
        if current is None:
            github_request(
                token,
                "PUT",
                f"/repos/{slug}/contents/{template_path}",
                json={
                    "message": "Add Hermes work ticket template",
                    "content": encoded,
                },
            )
        else:
            current_content = base64.b64decode(current.get("content", "")).decode(errors="replace")
            if current_content != desired:
                github_request(
                    token,
                    "PUT",
                    f"/repos/{slug}/contents/{template_path}",
                    json={
                        "message": "Update Hermes work ticket template",
                        "content": encoded,
                        "sha": current["sha"],
                    },
                )


    def add_issue_label(token, repository, issue_number, label):
        github_request(
            token,
            "POST",
            f"/repos/{repository}/issues/{issue_number}/labels",
            json={"labels": [label]},
        )


    def remove_issue_label(token, repository, issue_number, label):
        github_request(
            token,
            "DELETE",
            f"/repos/{repository}/issues/{issue_number}/labels/{label}",
            ok_404=True,
        )


    def comment_issue(token, repository, issue_number, body):
        github_request(
            token,
            "POST",
            f"/repos/{repository}/issues/{issue_number}/comments",
            json={"body": body},
        )


    def extract_issue_sections(body):
        sections = {}
        current = None
        current_lines = []
        for line in (body or "").splitlines():
            match = re.match(r"^#{1,6}\s+(.+?)\s*$", line)
            if match:
                if current is not None:
                    sections[current] = "\n".join(current_lines).strip()
                current = match.group(1).strip().lower()
                current_lines = []
            elif current is not None:
                current_lines.append(line)
        if current is not None:
            sections[current] = "\n".join(current_lines).strip()
        return sections


    def section_value(sections, name):
        return sections.get(name.lower(), "").strip()


    def validate_work_issue(issue, bot_authored=False):
        sections = extract_issue_sections(issue.get("body") or "")
        missing = []
        required = ("intent",) if bot_authored else ("intent", "goal", "acceptance criteria", "constraints", "notes")
        for name in required:
            if name not in sections:
                missing.append(f"missing section `{name.title()}`")
        target = section_value(sections, "target repository")
        new_repo = section_value(sections, "new repository")
        if "target repository" not in sections and "new repository" not in sections:
            missing.append("missing section `Target repository` or `New repository`")
        if not target and not new_repo:
            missing.append("either `Target repository` or `New repository` must be filled")
        non_empty_check = ("intent",) if bot_authored else ("intent", "goal", "acceptance criteria")
        for name in non_empty_check:
            if name in sections and not section_value(sections, name):
                missing.append(f"`{name.title()}` must not be empty")

        org = env("HERMES_GITHUB_ORG")
        if target and "/" in target and not target.startswith(f"{org}/"):
            missing.append(f"`Target repository` must be under `{org}` for v1")
        if new_repo and "/" in new_repo and not new_repo.startswith(f"{org}/"):
            missing.append(f"`New repository` must be under `{org}` for v1")

        return missing


    def clarify_invalid_issue(token, repository, issue, missing):
        issue_number = issue["number"]
        details = "\n".join(f"- {item}" for item in missing)
        comment_issue(
            token,
            repository,
            issue_number,
            "Hermes cannot start this ticket yet because the readiness gate failed:\n\n"
            f"{details}\n\n"
            "Please update the issue and re-apply `hermes-ready` when it is ready.",
        )
        add_issue_label(token, repository, issue_number, "hermes-clarifying")
        remove_issue_label(token, repository, issue_number, "hermes-ready")
        remove_issue_label(token, repository, issue_number, "hermes-working")


    def load_json_file(path, default):
        if not path.exists():
            return default
        return json.loads(path.read_text())


    def write_json_file(path, payload):
        tmp = path.with_suffix(".tmp")
        tmp.write_text(json.dumps(payload, indent=2, sort_keys=True))
        tmp.replace(path)


    def queue_attempt_paths():
        root = state_root()
        return root / "queue-active-run.json", root / "queue-timeouts.json"


    def selection_key(selection):
        if selection.get("kind") == "active_pr":
            return f"{selection['repository']}#pr-{selection['pull_request']}"
        return f"{selection['repository']}#issue-{selection['issue_number']}"


    def block_queue_issue(token, selection, reason):
        if not selection.get("repository") or not selection.get("issue_number"):
            return
        repository = selection["repository"]
        issue_number = int(selection["issue_number"])
        comment_issue(
            token,
            repository,
            issue_number,
            f"Hermes is blocking this ticket after three consecutive scheduled-run {reason}.",
        )
        add_issue_label(token, repository, issue_number, "hermes-blocked")
        remove_issue_label(token, repository, issue_number, "hermes-working")
        remove_issue_label(token, repository, issue_number, "hermes-ready")


    def record_queue_failure(token, selection, reason):
        if not selection:
            return 0
        key = selection.get("key") or selection_key(selection)
        _active_path, timeouts_path = queue_attempt_paths()
        timeouts = load_json_file(timeouts_path, {})
        timeouts[key] = int(timeouts.get(key, 0)) + 1
        write_json_file(timeouts_path, timeouts)
        if timeouts[key] >= 3:
            block_queue_issue(token, selection, reason)
        return timeouts[key]


    def record_stale_queue_attempt(token):
        active_path, _timeouts_path = queue_attempt_paths()
        if not active_path.exists():
            return
        active = load_json_file(active_path, {})
        started_at = parse_kube_time(active.get("started_at"))
        deadline = int(env("HERMES_QUEUE_ACTIVE_DEADLINE_SECONDS", "2700"))
        if started_at is None or now_utc() <= started_at + timedelta(seconds=deadline):
            return

        record_queue_failure(token, active, "timeouts")
        active_path.unlink(missing_ok=True)


    def mark_queue_run(selection):
        active_path, _timeouts_path = queue_attempt_paths()
        payload = dict(selection)
        payload["key"] = selection_key(selection)
        payload["started_at"] = kube_time(now_utc())
        write_json_file(active_path, payload)


    def finish_queue_run(selection, exit_code):
        active_path, timeouts_path = queue_attempt_paths()
        active_path.unlink(missing_ok=True)
        if exit_code == 0:
            timeouts = load_json_file(timeouts_path, {})
            timeouts.pop(selection_key(selection), None)
            write_json_file(timeouts_path, timeouts)
            return
        record_queue_failure(github_installation_token(), selection, "non-zero Hermes exits")


    def active_implementation_pr(token):
        org = env("HERMES_GITHUB_ORG")
        candidates = []
        for repo in installation_repositories(token):
            owner = (repo.get("owner") or {}).get("login")
            name = repo.get("name")
            if owner != org or not name:
                continue
            repository = f"{owner}/{name}"
            for pr in github_paginate(token, f"/repos/{repository}/pulls?state=open"):
                head = pr.get("head") or {}
                if str(head.get("ref", "")).startswith("hermes/issue-"):
                    candidates.append(
                        {
                            "kind": "active_pr",
                            "repository": repository,
                            "pull_request": pr["number"],
                            "html_url": pr.get("html_url"),
                            "head_ref": head.get("ref"),
                            "created_at": pr.get("created_at"),
                        }
                    )
        candidates.sort(key=lambda item: item.get("created_at") or "")
        return candidates[0] if candidates else None


    def ready_work_issue(token):
        repository = work_queue_slug()
        trusted_authors = {env("HERMES_WORK_AUTHOR")}
        bot_author = os.environ.get("HERMES_WORK_BOT_AUTHOR")
        if bot_author:
            trusted_authors.add(bot_author)
        label = env("HERMES_WORK_READY_LABEL", "hermes-ready")
        issues = github_paginate(
            token,
            f"/repos/{repository}/issues?state=open&labels={label}&sort=created&direction=asc",
        )
        for issue in issues:
            if issue.get("pull_request"):
                continue
            issue_author = (issue.get("user") or {}).get("login")
            if issue_author not in trusted_authors:
                continue
            bot_authored = bot_author is not None and issue_author == bot_author
            missing = validate_work_issue(issue, bot_authored=bot_authored)
            if missing:
                clarify_invalid_issue(token, repository, issue, missing)
                continue
            return {
                "kind": "ready_issue",
                "repository": repository,
                "issue_number": issue["number"],
                "html_url": issue.get("html_url"),
                "title": issue.get("title"),
                "created_at": issue.get("created_at"),
                "body": issue.get("body") or "",
            }
        return None


    def queue_preflight():
        token = github_installation_token()
        ensure_work_queue(token)
        record_stale_queue_attempt(token)
        active = active_implementation_pr(token)
        if active:
            print(f"selected active Hermes PR {active['repository']}#{active['pull_request']}")
            return active
        issue = ready_work_issue(token)
        if issue:
            print(f"selected ready issue {issue['repository']}#{issue['issue_number']}")
            return issue
        print("no valid ready work items found")
        return None


    class LeaseLock:
        def __init__(self, name, namespace, holder, duration_seconds=120):
            self.name = name
            self.namespace = namespace
            self.holder = holder
            self.duration_seconds = duration_seconds
            self.stop = threading.Event()
            self.thread = None
            self.token = (SA_DIR / "token").read_text().strip()
            self.ca_cert = str(SA_DIR / "ca.crt")
            self.api = f"https://{env('KUBERNETES_SERVICE_HOST')}:{env('KUBERNETES_SERVICE_PORT')}"

        def headers(self):
            return {
                "Authorization": f"Bearer {self.token}",
                "Content-Type": "application/json",
            }

        def url(self):
            return (
                f"{self.api}/apis/coordination.k8s.io/v1/namespaces/"
                f"{self.namespace}/leases/{self.name}"
            )

        def request(self, method, url, **kwargs):
            return requests.request(
                method,
                url,
                headers=self.headers(),
                verify=self.ca_cert,
                timeout=15,
                **kwargs,
            )

        def current(self):
            response = self.request("GET", self.url())
            if response.status_code == 404:
                return None
            if response.status_code >= 400:
                raise RuntimeError(f"lease GET failed with {response.status_code}: {response.text[:500]}")
            return response.json()

        def lease_body(self, resource_version=None, acquire_time=None):
            timestamp = now_utc()
            metadata = {"name": self.name, "namespace": self.namespace}
            if resource_version:
                metadata["resourceVersion"] = resource_version
            return {
                "apiVersion": "coordination.k8s.io/v1",
                "kind": "Lease",
                "metadata": metadata,
                "spec": {
                    "holderIdentity": self.holder,
                    "leaseDurationSeconds": self.duration_seconds,
                    "acquireTime": acquire_time or kube_time(timestamp),
                    "renewTime": kube_time(timestamp),
                },
            }

        def expired(self, lease):
            spec = lease.get("spec", {})
            renew_time = parse_kube_time(spec.get("renewTime"))
            duration = int(spec.get("leaseDurationSeconds") or self.duration_seconds)
            if renew_time is None:
                return True
            return now_utc() > renew_time + timedelta(seconds=duration)

        def acquire(self):
            lease = self.current()
            if lease is None:
                response = self.request(
                    "POST",
                    f"{self.api}/apis/coordination.k8s.io/v1/namespaces/{self.namespace}/leases",
                    json=self.lease_body(),
                )
                if response.status_code in (200, 201):
                    self.start_renewer()
                    return True
                if response.status_code == 409:
                    return False
                raise RuntimeError(f"lease CREATE failed with {response.status_code}: {response.text[:500]}")

            spec = lease.get("spec", {})
            holder = spec.get("holderIdentity")
            if holder != self.holder and not self.expired(lease):
                print(f"implementation lease held by {holder}; no work started")
                return False

            resource_version = lease["metadata"]["resourceVersion"]
            response = self.request(
                "PUT",
                self.url(),
                json=self.lease_body(resource_version, spec.get("acquireTime")),
            )
            if response.status_code in (200, 201):
                self.start_renewer()
                return True
            if response.status_code == 409:
                return False
            raise RuntimeError(f"lease UPDATE failed with {response.status_code}: {response.text[:500]}")

        def renew_once(self):
            lease = self.current()
            if lease is None:
                raise RuntimeError("lease disappeared during renewal")
            if lease.get("spec", {}).get("holderIdentity") != self.holder:
                raise RuntimeError("lease holder changed during renewal")
            resource_version = lease["metadata"]["resourceVersion"]
            response = self.request(
                "PUT",
                self.url(),
                json=self.lease_body(resource_version, lease.get("spec", {}).get("acquireTime")),
            )
            if response.status_code not in (200, 201):
                raise RuntimeError(f"lease RENEW failed with {response.status_code}: {response.text[:500]}")

        def renew_loop(self):
            while not self.stop.wait(30):
                try:
                    self.renew_once()
                except Exception as exc:
                    print(f"lease renewal failed: {exc}", file=sys.stderr)
                    os._exit(2)

        def start_renewer(self):
            self.thread = threading.Thread(target=self.renew_loop, daemon=True)
            self.thread.start()

        def release(self):
            self.stop.set()
            try:
                lease = self.current()
                if lease and lease.get("spec", {}).get("holderIdentity") == self.holder:
                    response = self.request("DELETE", self.url())
                    if response.status_code not in (200, 202, 404):
                        print(f"lease DELETE failed with {response.status_code}", file=sys.stderr)
            finally:
                if self.thread:
                    self.thread.join(timeout=2)


    def state_root():
        root = Path(env("HERMES_AUTONOMY_ROOT", "/opt/data/hermes-autonomy")) / "state"
        root.mkdir(parents=True, exist_ok=True)
        (root / "review-events").mkdir(parents=True, exist_ok=True)
        return root


    def prompt_text(path):
        return Path(path).read_text()


    def workspace_usage():
        root = Path(env("HERMES_WORKSPACE_ROOT", "/opt/data/workspaces/github"))
        if not root.exists():
            return 0
        total = 0
        for child in root.rglob("*"):
            try:
                if child.is_file():
                    total += child.stat().st_size
            except OSError:
                pass
        return total


    def enforce_disk_policy():
        usage = workspace_usage()
        warn = int(env("HERMES_DISK_WARN_BYTES", "7516192768"))
        block = int(env("HERMES_DISK_BLOCK_BYTES", "9663676416"))
        if usage >= block:
            raise RuntimeError(f"workspace usage {usage} bytes exceeds block threshold {block}")
        if usage >= warn:
            print(f"workspace usage warning: {usage} bytes exceeds warning threshold {warn}")


    def cleanup_internal_cron_jobs():
        cron_path = Path(env("HERMES_HOME", "/opt/data")) / "cron" / "jobs.json"
        if not cron_path.exists():
            return
        try:
            data = json.loads(cron_path.read_text())
        except Exception as exc:
            print(f"could not inspect Hermes internal cron jobs: {exc}", file=sys.stderr)
            return

        jobs = data.get("jobs", [])
        kept = []
        removed = []
        for job in jobs:
            name = str(job.get("name") or "")
            prompt = str(job.get("prompt") or "")
            is_duplicate_scheduler = (
                name == "Hourly GitHub Work Trigger"
                or (
                    "kvarnberg-labs/hermes-work-queue" in prompt
                    and "GitHub Work Trigger" in name
                )
                or (
                    "autonomous hourly GitHub work trigger" in prompt
                    and "hermes-work-queue" in prompt
                )
            )
            if is_duplicate_scheduler:
                removed.append(job.get("id") or name or "<unknown>")
            else:
                kept.append(job)

        if not removed:
            return

        data["jobs"] = kept
        data["updated_at"] = kube_time(now_utc())
        tmp = cron_path.with_suffix(".tmp")
        tmp.write_text(json.dumps(data, indent=2, sort_keys=False))
        tmp.replace(cron_path)
        print(f"removed duplicate Hermes internal cron job(s): {', '.join(map(str, removed))}")


    def run_hermes(prompt, event_path=None, extra_payload=None):
        token = github_installation_token()
        run_env = os.environ.copy()
        run_env["GITHUB_TOKEN"] = token
        run_env["HERMES_GITHUB_TOKEN"] = token
        run_env["HERMES_HOME"] = env("HERMES_HOME", "/opt/data")
        run_env["HERMES_YOLO_MODE"] = "1"
        run_env.setdefault("HERMES_ACCEPT_HOOKS", "1")

        if event_path:
            event = Path(event_path).read_text()
            prompt = f"{prompt}\n\nReview event JSON:\n```json\n{event}\n```\n"
        if extra_payload is not None:
            payload = json.dumps(extra_payload, indent=2, sort_keys=True)
            prompt = f"{prompt}\n\nSelected work item JSON:\n```json\n{payload}\n```\n"

        root = Path(env("HERMES_AUTONOMY_ROOT", "/opt/data/hermes-autonomy"))
        root.mkdir(parents=True, exist_ok=True)
        hermes_bin = env("HERMES_BIN", "/opt/hermes/.venv/bin/hermes")
        max_turns = env("HERMES_MAX_ITERATIONS", "60")
        command = [hermes_bin, "chat", "--max-turns", max_turns, "-Q", "-q", prompt]
        cleanup_internal_cron_jobs()
        try:
            return subprocess.run(command, cwd=str(root), env=run_env).returncode
        finally:
            cleanup_internal_cron_jobs()


    def lock_holder():
        pod_name = os.environ.get("HOSTNAME", socket.gethostname())
        return f"{pod_name}-{uuid.uuid4()}"


    def with_lease(fn):
        namespace = (SA_DIR / "namespace").read_text().strip()
        lease = LeaseLock(
            env("HERMES_IMPLEMENTATION_LEASE_NAME", "hermes-autonomy-implementation"),
            namespace,
            lock_holder(),
        )
        if not lease.acquire():
            return 0
        try:
            return fn()
        finally:
            lease.release()


    def queue_mode():
        selection = queue_preflight()
        if selection is None:
            return 0

        def work():
            enforce_disk_policy()
            mark_queue_run(selection)
            code = run_hermes(
                prompt_text(env("HERMES_QUEUE_PROMPT_PATH")),
                extra_payload={"selected_work": selection},
            )
            finish_queue_run(selection, code)
            return code

        return with_lease(work)


    def load_cursor(path):
        if not path.exists():
            return {}
        return json.loads(path.read_text())


    def save_cursor(path, cursor):
        tmp = path.with_suffix(".tmp")
        tmp.write_text(json.dumps(cursor, indent=2, sort_keys=True))
        tmp.replace(path)


    def max_id(items):
        ids = [int(item["id"]) for item in items if item.get("id") is not None]
        return max(ids) if ids else 0


    def user_events(items, previous_id, author, event_type):
        events = []
        for item in items:
            item_id = int(item.get("id") or 0)
            login = (item.get("user") or {}).get("login")
            if item_id > previous_id and login == author:
                events.append({"type": event_type, "id": item_id, "payload": item})
        return events


    def installation_repositories(token):
        return github_paginate(token, "/installation/repositories")


    def write_event_file(event):
        path = state_root() / "review-events" / f"{int(time.time())}-{uuid.uuid4()}.json"
        path.write_text(json.dumps(event, indent=2, sort_keys=True))
        return path


    def discover_review_events():
        token = github_installation_token()
        org = env("HERMES_GITHUB_ORG")
        author = env("HERMES_WORK_AUTHOR")
        cursor_path = state_root() / "review-cursors.json"
        cursor = load_cursor(cursor_path)
        first_scan = not cursor_path.exists()
        found = []

        for repo in installation_repositories(token):
            owner = (repo.get("owner") or {}).get("login")
            name = repo.get("name")
            if owner != org or not name:
                continue

            pulls = github_paginate(token, f"/repos/{owner}/{name}/pulls?state=open")
            for pr in pulls:
                head = pr.get("head") or {}
                if not str(head.get("ref", "")).startswith("hermes/issue-"):
                    continue

                number = pr["number"]
                key = f"{owner}/{name}#{number}"
                entry = cursor.setdefault(key, {})
                issue_comments = github_paginate(token, f"/repos/{owner}/{name}/issues/{number}/comments")
                review_comments = github_paginate(token, f"/repos/{owner}/{name}/pulls/{number}/comments")
                reviews = github_paginate(token, f"/repos/{owner}/{name}/pulls/{number}/reviews")

                if not first_scan:
                    found.extend(
                        {
                            "repository": f"{owner}/{name}",
                            "pull_request": number,
                            "html_url": pr.get("html_url"),
                            "event": event,
                        }
                        for event in user_events(issue_comments, int(entry.get("issue_comments", 0)), author, "issue_comment")
                    )
                    found.extend(
                        {
                            "repository": f"{owner}/{name}",
                            "pull_request": number,
                            "html_url": pr.get("html_url"),
                            "event": event,
                        }
                        for event in user_events(review_comments, int(entry.get("review_comments", 0)), author, "review_comment")
                    )
                    found.extend(
                        {
                            "repository": f"{owner}/{name}",
                            "pull_request": number,
                            "html_url": pr.get("html_url"),
                            "event": event,
                        }
                        for event in user_events(reviews, int(entry.get("reviews", 0)), author, "review")
                    )

                entry["issue_comments"] = max_id(issue_comments)
                entry["review_comments"] = max_id(review_comments)
                entry["reviews"] = max_id(reviews)

        save_cursor(cursor_path, cursor)
        return [write_event_file(event) for event in found]


    def pending_event():
        events = sorted((state_root() / "review-events").glob("*.json"))
        return events[0] if events else None


    def fast_poll_mode():
        event_path = pending_event()
        if event_path is None:
            new_events = discover_review_events()
            if not new_events:
                print("no actionable GitHub review/comment events found")
                return 0
            event_path = new_events[0]
            print(f"queued {len(new_events)} actionable GitHub review/comment event(s)")

        def work():
            enforce_disk_policy()
            code = run_hermes(prompt_text(env("HERMES_REVIEW_PROMPT_PATH")), event_path)
            if code == 0:
                event_path.unlink(missing_ok=True)
            return code

        return with_lease(work)


    def main():
        if len(sys.argv) != 2 or sys.argv[1] not in {"queue", "fast-poll"}:
            print("usage: autonomy_trigger.py queue|fast-poll", file=sys.stderr)
            return 2
        if sys.argv[1] == "queue":
            return queue_mode()
        return fast_poll_mode()


    if __name__ == "__main__":
        raise SystemExit(main())
