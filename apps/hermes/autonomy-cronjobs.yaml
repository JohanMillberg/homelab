apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-autonomy-queue
  namespace: hermes
spec:
  schedule: "7 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 2700
      backoffLimit: 0
      template:
        spec:
          imagePullSecrets:
            - name: forgejo-registry-secret
          serviceAccountName: hermes-autonomy
          restartPolicy: Never
          initContainers:
            - name: install-github-cli
              image: forgejo.lan/kvarnberg/hermes-agent:main-5defdf099
              imagePullPolicy: IfNotPresent
              command: ["/opt/hermes-github-tools/install-gh"]
              volumeMounts:
                - name: data
                  mountPath: /opt/data
                - name: github-cli-bin
                  mountPath: /opt/github-cli
                - name: github-tools
                  mountPath: /opt/hermes-github-tools
                  readOnly: true
          containers:
            - name: hermes
              image: forgejo.lan/kvarnberg/hermes-agent:main-5defdf099
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: hermes-config
                - configMapRef:
                    name: hermes-autonomy-config
                - secretRef:
                    name: hermes-discord-secret
                - secretRef:
                    name: hermes-model-secret
                - secretRef:
                    name: hermes-github-app-secret
              env:
                - name: HERMES_HOME
                  value: /opt/data
                - name: HERMES_MAX_ITERATIONS
                  value: "60"
                - name: HERMES_GITHUB_PRIVATE_KEY_FILE
                  value: /opt/hermes-secrets/github-app/HERMES_GITHUB_PRIVATE_KEY
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -eu
                  mkdir -p /opt/data/hermes-autonomy/state/review-events /opt/data/workspaces/github
                  chown -R 10000:10000 /opt/data/hermes-autonomy /opt/data/workspaces
                  exec su hermes -c "/opt/hermes/.venv/bin/python /opt/hermes-autonomy/scripts/autonomy_trigger.py queue"
              volumeMounts:
                - name: data
                  mountPath: /opt/data
                - name: autonomy-prompts
                  mountPath: /opt/hermes-autonomy/prompts
                  readOnly: true
                - name: autonomy-scripts
                  mountPath: /opt/hermes-autonomy/scripts
                  readOnly: true
                - name: github-cli-bin
                  mountPath: /opt/github-cli
                  readOnly: true
                - name: github-tools
                  mountPath: /usr/local/bin/gh
                  subPath: gh
                  readOnly: true
                - name: github-tools
                  mountPath: /usr/local/bin/github-app-token
                  subPath: github-app-token
                  readOnly: true
                - name: github-app-private-key
                  mountPath: /opt/hermes-secrets/github-app
                  readOnly: true
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: hermes-data
            - name: autonomy-prompts
              configMap:
                name: hermes-autonomy-prompts
            - name: autonomy-scripts
              configMap:
                name: hermes-autonomy-scripts
            - name: github-cli-bin
              emptyDir: {}
            - name: github-tools
              configMap:
                name: hermes-github-tools
                defaultMode: 0555
            - name: github-app-private-key
              secret:
                secretName: hermes-github-app-secret
                items:
                  - key: HERMES_GITHUB_PRIVATE_KEY
                    path: HERMES_GITHUB_PRIVATE_KEY
---
