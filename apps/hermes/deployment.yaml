apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 0
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        hermes.kvarnberg.io/config-generation: "opencode-go-deepseek-v4-pro-2026-06-22b-userlim12k"
    spec:
      serviceAccountName: hermes-autonomy
      imagePullSecrets:
        - name: forgejo-registry-secret
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10000:10000 /opt/data"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: install-github-cli
          image: forgejo.lan/kvarnberg/hermes-agent:main-f055f612c
          imagePullPolicy: IfNotPresent
          command: ["/opt/hermes-github-tools/install-gh"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: github-cli-bin
              mountPath: /opt/github-cli
            - name: github-tools
              mountPath: /opt/hermes-github-tools
              readOnly: true
        - name: configure-hermes
          image: forgejo.lan/kvarnberg/hermes-agent:main-f055f612c
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              chown -R 10000:10000 /opt/data
              if [ -n "${HERMES_INFERENCE_PROVIDER:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.provider '$HERMES_INFERENCE_PROVIDER'"
              fi
              if [ -n "${HERMES_INFERENCE_MODEL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.default '$HERMES_INFERENCE_MODEL'"
              fi
              if [ -n "${HERMES_INFERENCE_BASE_URL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.base_url '$HERMES_INFERENCE_BASE_URL'"
              fi
              # Auxiliary tasks: use opencode-go + Flash model (cheap, no extra billing)
              # Fixes recurring OpenRouter payment errors from provider: auto routing
              for t in compression curator title_generation triage_specifier kanban_decomposer \
                       profile_describer approval mcp skills_hub web_extract vision; do
                su hermes -c "/opt/hermes/.venv/bin/hermes config set auxiliary.$t.provider opencode-go"
                su hermes -c "/opt/hermes/.venv/bin/hermes config set auxiliary.$t.base_url '$HERMES_INFERENCE_BASE_URL'"
                su hermes -c "/opt/hermes/.venv/bin/hermes config set auxiliary.$t.model deepseek-v4-flash"
              done
              # Memory: raise limits so agent stops looping on 'would exceed the limit'
              su hermes -c "/opt/hermes/.venv/bin/hermes config set memory.memory_char_limit 8000"
              # User profile: raise to fit several distinct user profiles (was 1375 default)
              su hermes -c "/opt/hermes/.venv/bin/hermes config set memory.user_char_limit 12000"
              # Loop safety: stop runaway same-tool retries gracefully
              su hermes -c "/opt/hermes/.venv/bin/hermes config set tool_loop_guardrails.hard_stop_enabled true"
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_GITHUB_PRIVATE_KEY_FILE
              value: /opt/hermes-secrets/github-app/HERMES_GITHUB_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes
          image: forgejo.lan/kvarnberg/hermes-agent:main-f055f612c
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          ports:
            - name: api
              containerPort: 8642
          envFrom:
            - configMapRef:
                name: hermes-config
            - configMapRef:
                name: hermes-autonomy-config
            - secretRef:
                name: hermes-api-secret
            - secretRef:
                name: hermes-discord-secret
            - secretRef:
                name: hermes-model-secret
            - secretRef:
                name: hermes-github-app-secret
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: github-cli-bin
              mountPath: /opt/github-cli
              readOnly: true
            - name: github-tools
              mountPath: /usr/local/bin/gh
              subPath: gh
              readOnly: true
            - name: github-tools
              mountPath: /usr/local/bin/github-app-token
              subPath: github-app-token
              readOnly: true
            - name: github-app-private-key
              mountPath: /opt/hermes-secrets/github-app
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: github-cli-bin
          emptyDir: {}
        - name: github-tools
          configMap:
            name: hermes-github-tools
            defaultMode: 0555
        - name: github-app-private-key
          secret:
            secretName: hermes-github-app-secret
            items:
              - key: HERMES_GITHUB_PRIVATE_KEY
                path: HERMES_GITHUB_PRIVATE_KEY
