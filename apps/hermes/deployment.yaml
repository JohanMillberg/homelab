apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        hermes.kvarnberg.io/config-generation: "opencode-go-deepseek-v4-flash-2026-05-28"
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10000:10000 /opt/data"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: configure-hermes
          image: docker.io/nousresearch/hermes-agent@sha256:b6e41c155d6bfce5ad83c5d0fec670086db8a43250e4511c9474134be5482d33
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              chown -R 10000:10000 /opt/data
              if [ -n "${HERMES_INFERENCE_PROVIDER:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.provider '$HERMES_INFERENCE_PROVIDER'"
              fi
              if [ -n "${HERMES_INFERENCE_MODEL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.default '$HERMES_INFERENCE_MODEL'"
              fi
              if [ -n "${HERMES_INFERENCE_BASE_URL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.base_url '$HERMES_INFERENCE_BASE_URL'"
              fi
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent@sha256:b6e41c155d6bfce5ad83c5d0fec670086db8a43250e4511c9474134be5482d33
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          ports:
            - name: api
              containerPort: 8642
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-api-secret
            - secretRef:
                name: hermes-discord-secret
            - secretRef:
                name: hermes-model-secret
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
