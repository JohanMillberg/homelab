apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes
      annotations:
        hermes.kvarnberg.io/config-generation: "opencode-go-deepseek-v4-flash-2026-05-31"
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 10000:10000 /opt/data"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: install-github-cli
          image: docker.io/nousresearch/hermes-agent@sha256:2bba4ab37729ebdd864d4caf277b24fec4cd8bfc2855185fd9f4c90f9bf7bfa3
          imagePullPolicy: IfNotPresent
          command: ["/opt/hermes-github-tools/install-gh"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: github-cli-bin
              mountPath: /opt/github-cli
            - name: github-tools
              mountPath: /opt/hermes-github-tools
              readOnly: true
        - name: configure-hermes
          image: docker.io/nousresearch/hermes-agent@sha256:2bba4ab37729ebdd864d4caf277b24fec4cd8bfc2855185fd9f4c90f9bf7bfa3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              chown -R 10000:10000 /opt/data
              if [ -n "${HERMES_INFERENCE_PROVIDER:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.provider '$HERMES_INFERENCE_PROVIDER'"
              fi
              if [ -n "${HERMES_INFERENCE_MODEL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.default '$HERMES_INFERENCE_MODEL'"
              fi
              if [ -n "${HERMES_INFERENCE_BASE_URL:-}" ]; then
                su hermes -c "/opt/hermes/.venv/bin/hermes config set model.base_url '$HERMES_INFERENCE_BASE_URL'"
              fi
          envFrom:
            - configMapRef:
                name: hermes-config
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_GITHUB_PRIVATE_KEY_FILE
              value: /opt/hermes-secrets/github-app/HERMES_GITHUB_PRIVATE_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent@sha256:2bba4ab37729ebdd864d4caf277b24fec4cd8bfc2855185fd9f4c90f9bf7bfa3
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          ports:
            - name: api
              containerPort: 8642
          envFrom:
            - configMapRef:
                name: hermes-config
            - configMapRef:
                name: hermes-autonomy-config
            - secretRef:
                name: hermes-api-secret
            - secretRef:
                name: hermes-discord-secret
            - secretRef:
                name: hermes-model-secret
            - secretRef:
                name: hermes-github-app-secret
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: github-cli-bin
              mountPath: /opt/github-cli
              readOnly: true
            - name: github-tools
              mountPath: /usr/local/bin/gh
              subPath: gh
              readOnly: true
            - name: github-tools
              mountPath: /usr/local/bin/github-app-token
              subPath: github-app-token
              readOnly: true
            - name: github-app-private-key
              mountPath: /opt/hermes-secrets/github-app
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: github-cli-bin
          emptyDir: {}
        - name: github-tools
          configMap:
            name: hermes-github-tools
            defaultMode: 0555
        - name: github-app-private-key
          secret:
            secretName: hermes-github-app-secret
            items:
              - key: HERMES_GITHUB_PRIVATE_KEY
                path: HERMES_GITHUB_PRIVATE_KEY
