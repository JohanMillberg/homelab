apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-github-tools
  namespace: hermes
data:
  install-gh: |
    #!/bin/sh
    set -eu
    version="2.65.0"
    case "$(uname -m)" in
      x86_64) arch="amd64" ;;
      aarch64|arm64) arch="arm64" ;;
      *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
    esac
    asset="gh_${version}_linux_${arch}.tar.gz"
    cached="/opt/data/bin/gh-${version}-linux-${arch}"
    mkdir -p /opt/data/bin /opt/github-cli
    if [ ! -x "$cached" ]; then
      tmp="$(mktemp -d)"
      trap 'rm -rf "$tmp"' EXIT
      base="https://github.com/cli/cli/releases/download/v${version}"
      curl -fsSL "$base/$asset" -o "$tmp/$asset"
      curl -fsSL "$base/gh_${version}_checksums.txt" -o "$tmp/checksums.txt"
      (cd "$tmp" && grep "  $asset$" checksums.txt | sha256sum -c -)
      tar -xzf "$tmp/$asset" -C "$tmp"
      cp "$tmp/gh_${version}_linux_${arch}/bin/gh" "$cached"
      chmod 0555 "$cached"
    fi
    cp "$cached" /opt/github-cli/gh
    chmod 0555 /opt/github-cli/gh
  github-app-token: |
    #!/bin/sh
    set -eu
    exec /opt/hermes/.venv/bin/python - <<'PY'
    import os
    import time

    import jwt
    import requests

    app_id = os.environ["HERMES_GITHUB_APP_ID"]
    installation_id = os.environ["HERMES_GITHUB_INSTALLATION_ID"]
    private_key = os.environ["HERMES_GITHUB_PRIVATE_KEY"]
    issued_at = int(time.time()) - 60
    app_jwt = jwt.encode(
        {"iat": issued_at, "exp": issued_at + 540, "iss": app_id},
        private_key,
        algorithm="RS256",
    )
    response = requests.post(
        f"https://api.github.com/app/installations/{installation_id}/access_tokens",
        headers={
            "Accept": "application/vnd.github+json",
            "Authorization": f"Bearer {app_jwt}",
            "X-GitHub-Api-Version": "2022-11-28",
        },
        timeout=30,
    )
    response.raise_for_status()
    print(response.json()["token"])
    PY
  gh: |
    #!/bin/sh
    set -eu
    if [ -z "${GH_TOKEN:-}" ]; then
      if [ -n "${GITHUB_TOKEN:-}" ]; then
        export GH_TOKEN="$GITHUB_TOKEN"
      else
        GH_TOKEN="$(github-app-token)"
        export GH_TOKEN
        export GITHUB_TOKEN="$GH_TOKEN"
      fi
    elif [ -z "${GITHUB_TOKEN:-}" ]; then
      export GITHUB_TOKEN="$GH_TOKEN"
    fi
    exec /opt/github-cli/gh "$@"
